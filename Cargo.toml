[workspace]
members = [
    "crates/biosim4-core",
    "crates/biosim4-actions",
    "crates/biosim4-sensors",
    "crates/biosim4-challenges",
    "crates/biosim4-breeds",
    "crates/biosim4-native",
    "crates/biosim4-bevy",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }

[workspace.lints.clippy]
# Tests build configs incrementally with `let mut cfg = X::default(); cfg.foo
# = a; cfg.bar = b;` — deliberate and clearer than a struct-update literal
# that spans many lines.
field_reassign_with_default = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Bevy benefits from optimized dependencies even in dev builds — without this,
# asset/texture loading and the renderer crawl. The crate's own code is left
# unoptimized (fast incremental rebuilds), but its dependencies are compiled
# with full optimization.
[profile.dev.package."*"]
opt-level = 3
