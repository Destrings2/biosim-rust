# cargo-deny config. Run with: `cargo deny check`

[graph]
all-features = false

[advisories]
version = 2
ignore = [
    # `paste` is archived but has no API-compatible replacement; pulled in
    # transitively via wgpu-hal → metal. Revisit once Bevy/wgpu migrate.
    "RUSTSEC-2024-0436",
    # `number_prefix` is unmaintained; pulled in via indicatif. Low risk —
    # the crate is small and frozen, not a security advisory. Revisit when
    # indicatif drops the dependency.
    "RUSTSEC-2025-0119",
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `path = "..."` deps don't carry a version, which
# cargo-deny otherwise flags as wildcards. Registry-pulled wildcards
# still fail.
allow-wildcard-paths = true
# Bevy + egui pull in two rand and three getrandom versions transitively.
# Permit until the ecosystem converges; biosim4-core itself stays on rand 0.8.
skip = [
    { name = "rand" },
    { name = "rand_core" },
    { name = "rand_chacha" },
    { name = "getrandom" },
    { name = "wasi" },
    { name = "windows-sys" },
    { name = "windows-targets" },
    { name = "windows_x86_64_msvc" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_aarch64_msvc" },
    { name = "windows_i686_msvc" },
    { name = "windows_i686_gnu" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
