# cargo-deny config. Run with: `cargo deny check`

[graph]
all-features = false

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Bevy + egui pull in two rand and three getrandom versions transitively.
# Permit until the ecosystem converges; biosim4-core itself stays on rand 0.8.
skip = [
    { name = "rand" },
    { name = "rand_core" },
    { name = "rand_chacha" },
    { name = "getrandom" },
    { name = "wasi" },
    { name = "windows-sys" },
    { name = "windows-targets" },
    { name = "windows_x86_64_msvc" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_aarch64_msvc" },
    { name = "windows_i686_msvc" },
    { name = "windows_i686_gnu" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
