[package]
name = "biosim4-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Platform-agnostic genetic neural-net artificial-life simulation engine"

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rayon = { version = "1.8", optional = true }

[dev-dependencies]
# Tests and examples that exercise the simulation pipeline need built-in
# sensors, actions, and challenges. Core itself does not depend on these
# (so adding one does not trigger a core rebuild) — only dev builds pull them in.
biosim4-sensors = { path = "../biosim4-sensors" }
biosim4-actions = { path = "../biosim4-actions" }
biosim4-challenges = { path = "../biosim4-challenges" }

[lints]
workspace = true
