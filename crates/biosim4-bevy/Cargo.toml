[package]
name = "biosim4-bevy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native Bevy frontend for biosim4-rs with parallel simulation stepping"

[[bin]]
name = "biosim4-bevy"
path = "src/main.rs"

[dependencies]
biosim4-core = { path = "../biosim4-core", features = ["parallel"] }
biosim4-sensors = { path = "../biosim4-sensors" }
biosim4-actions = { path = "../biosim4-actions" }
biosim4-challenges = { path = "../biosim4-challenges" }
biosim4-breeds = { path = "../biosim4-breeds" }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = "1.8"

# Trimmed Bevy feature set for a 2D simulation viewer with native UI primitives
# (sprite, text, gizmos). 3D, audio, gltf, animation, and PBR are off — they'd
# bloat the build with no visible benefit.
bevy = { version = "0.18", default-features = false, features = [
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    # Bevy 0.18 split the 2D pipeline into API + renderer crates — without the
    # `_render` features below, sprites/UI/gizmos compile and upload but the
    # actual render plugins are absent, so nothing draws.
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "bevy_log",
    "bevy_asset",
    "bevy_state",
    "bevy_image",
    "bevy_gizmos",
    "bevy_gizmos_render",
    # bevy_picking, tonemapping_luts: not used. Agent selection uses raw
    # cursor coords + canvas math, not Bevy's picking plugin. The renderer
    # blits 8-bit RGB directly with no HDR pipeline.
    "default_font",
    "x11",
    "wayland",
] }

# bevy_egui pairs egui's mature widget set (sliders, dropdowns, multi-tabs,
# painter for the neural-net inspector) with Bevy's rendering. Pinned to a
# version that targets Bevy 0.18 — if Cargo resolves a mismatch, bump this
# along with the Bevy major. `picking` is dropped: it would otherwise require
# bevy's `bevy_picking` feature (we don't enable it; agent selection uses
# raw cursor coords), and bevy_egui logs a runtime WARN about the mismatch.
bevy_egui = { version = "0.39", default-features = false, features = [
    "manage_clipboard",
    "open_url",
    "default_fonts",
    "render",
    "bevy_ui",
] }


[lints]
workspace = true
