[package]
name = "biosim4-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless CLI runner for biosim4-rs"

[dependencies]
biosim4-core = { path = "../biosim4-core", features = ["parallel"] }
biosim4-sensors = { path = "../biosim4-sensors" }
biosim4-actions = { path = "../biosim4-actions" }
biosim4-challenges = { path = "../biosim4-challenges" }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
rayon = "1.8"

[lints]
workspace = true
